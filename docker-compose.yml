services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vox_content_os
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
    ports:
      - "5432:5432"
    volumes:
      - vox_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Shanghai
    volumes:
      - vox_n8n:/home/node/.n8n

volumes:
  vox_pgdata:
  vox_n8n:
